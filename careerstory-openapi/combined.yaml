openapi: 3.0.3
info:
  title: CareerStory API
  description: >
    RESTful API for CareerStory - a platform where Software Engineers share and
    discover interview experiences and career stories.


    All successful responses are wrapped in a standard envelope
    (`success`, `statusCode`, `message`, and an optional `result`). Errors use
    the same envelope with `success: false` and an optional `details` array of
    field-level validation errors. Authenticated endpoints expect a
    `Authorization: Bearer <JWT>` header, where the token is obtained from
    `POST /auth/login`.
  version: 1.0.0
  license:
    name: ISC
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication and account credential operations
  - name: Users
    description: User profile and account management
  - name: Stories
    description: Interview experiences and career stories
  - name: Categories
    description: Story categories

paths:
  # ==================== AUTH ====================
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        Creates a new user account together with its credentials. `password`
        and `confirmPassword` must match. Fails with 409 if the username or
        email already exists.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      description: >
        Authenticates a user by username and password and returns a JWT access
        token. The account's email must be verified.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== USERS ====================
  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      description: Returns a paginated list of users. Public endpoint.
      operationId: getAllUsers
      parameters:
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - name: orderBy
          in: query
          required: false
          description: Field to order results by
          schema:
            type: string
            enum: [userId, userName, name, email, joinDate]
            default: userName
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/profile:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      description: Updates the current user's own profile. At least one field is required.
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/change-role/{userId}:
    patch:
      tags: [Users]
      summary: Change a user's role (admin only)
      operationId: changeUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by ID
      description: Public endpoint.
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== STORIES ====================
  /stories:
    post:
      tags: [Stories]
      summary: Create a story
      description: >
        Creates a new story owned by the authenticated user. When
        `generateSummary` is true an AI summary is generated (a summarization
        failure is logged and results in a null summary rather than failing the
        request).
      operationId: createStory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
      responses:
        '201':
          description: Story created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Stories]
      summary: List stories (paginated)
      description: Returns a paginated list of stories, optionally filtered by category. Public endpoint.
      operationId: getAllStories
      parameters:
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - $ref: '#/components/parameters/StoryOrderByQuery'
        - $ref: '#/components/parameters/CategoryFilterQuery'
      responses:
        '200':
          description: Stories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedStories'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stories/user/{userId}:
    get:
      tags: [Stories]
      summary: List stories by a specific user (paginated)
      description: Public endpoint.
      operationId: getStoriesByUser
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - $ref: '#/components/parameters/StoryOrderByQuery'
        - $ref: '#/components/parameters/CategoryFilterQuery'
      responses:
        '200':
          description: User stories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedStories'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stories/{storyId}:
    get:
      tags: [Stories]
      summary: Get a story by ID
      description: Public endpoint.
      operationId: getStoryById
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      responses:
        '200':
          description: Story retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Stories]
      summary: Update a story
      description: >
        Updates a story. Requires authentication; the caller must be the story
        owner or an admin. At least one field is required.
      operationId: updateStory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryRequest'
      responses:
        '200':
          description: Story updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Stories]
      summary: Delete a story
      description: >
        Soft-deletes a story. Requires authentication; the caller must be the
        story owner or an admin.
      operationId: deleteStory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      responses:
        '204':
          description: Story deleted successfully (no content)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== CATEGORIES ====================
  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      description: Returns all categories as a flat array (not paginated). Public endpoint.
      operationId: getAllCategories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Categories]
      summary: Create a category (admin only)
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update a category (admin only)
      description: Updates a category. At least one field is required.
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Categories]
      summary: Delete a category (admin only)
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
      responses:
        '204':
          description: Category deleted successfully (no content)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/login

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: integer
    StoryIdPath:
      name: storyId
      in: path
      required: true
      description: Story ID
      schema:
        type: integer
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      description: Category ID
      schema:
        type: integer
    FindQuery:
      name: find
      in: query
      required: false
      description: Free-text search term
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ItemsPerPageQuery:
      name: itemsPerPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortDirectionQuery:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
        default: ASC
    StoryOrderByQuery:
      name: orderBy
      in: query
      required: false
      description: Field to order results by
      schema:
        type: string
        enum: [storyId, userId, title, body, createdAt, updatedAt]
        default: userId
    CategoryFilterQuery:
      name: category
      in: query
      required: false
      description: >
        Filter by one or more category names (case-insensitive). Repeat the
        parameter to pass multiple values, e.g.
        `?category=Backend&category=System%20Design`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

  schemas:
    # ---------- Auth ----------
    SignupRequest:
      type: object
      additionalProperties: false
      required: [userName, email, name, password, confirmPassword]
      properties:
        userName:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9_]+$'
          example: john_doe
        email:
          type: string
          format: email
          maxLength: 255
          example: john@example.com
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: John Doe
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: Must include lowercase, uppercase, a number, and a special character.
          example: Passw0rd!
        confirmPassword:
          type: string
          minLength: 6
          maxLength: 128
          example: Passw0rd!

    LoginRequest:
      type: object
      additionalProperties: false
      required: [userName, password]
      properties:
        userName:
          type: string
          example: john_doe
        password:
          type: string
          example: Passw0rd!

    AuthResult:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          example: 2592000
        user:
          $ref: '#/components/schemas/UserProfile'

    # ---------- Users ----------
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
          nullable: true
        organization:
          type: string
          maxLength: 255
          nullable: true
        linkedInUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        githubUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        portfolioUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true

    UpdateUserRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, USER]

    UserProfile:
      type: object
      properties:
        userId:
          type: integer
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        linkedInUrl:
          type: string
          format: uri
          nullable: true
        githubUrl:
          type: string
          format: uri
          nullable: true
        portfolioUrl:
          type: string
          format: uri
          nullable: true
        isEmailVerified:
          type: boolean
        role:
          type: string
          enum: [ADMIN, USER]
        joinDate:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    # ---------- Stories ----------
    CreateStoryRequest:
      type: object
      additionalProperties: false
      required: [title, body, generateSummary]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
          example: My Google onsite experience
        body:
          type: string
          minLength: 10
          maxLength: 5000
        categoryIds:
          type: array
          default: []
          items:
            type: integer
        generateSummary:
          type: boolean
          description: Whether to generate an AI summary for the story.
          example: false

    UpdateStoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
        body:
          type: string
          minLength: 10
          maxLength: 5000
        categoryIds:
          type: array
          items:
            type: integer
        generateSummary:
          type: boolean

    Story:
      type: object
      properties:
        storyId:
          type: integer
        title:
          type: string
        body:
          type: string
        summary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: '#/components/schemas/StoryCategory'
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StoryUser'

    StoryCategory:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true

    StoryUser:
      type: object
      properties:
        userId:
          type: integer
        userName:
          type: string
        name:
          type: string
        organization:
          type: string
          nullable: true

    PaginatedStories:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Story'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    # ---------- Categories ----------
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: System Design
        description:
          type: string
          maxLength: 255
          nullable: true

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 255
          nullable: true

    Category:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ---------- Shared ----------
    PaginationMetadata:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        itemsPerPage:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        nextPage:
          type: integer
          nullable: true
        previousPage:
          type: integer
          nullable: true

    SuccessEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
        result:
          description: Present only when the endpoint returns data.
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    ValidationError:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Missing or invalid authentication / credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: The caller lacks permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict (e.g. duplicate username, email, or category name)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
