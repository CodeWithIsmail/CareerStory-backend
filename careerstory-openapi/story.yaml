openapi: 3.0.3
info:
  title: CareerStory API - Stories
  description: >
    Story endpoints for the CareerStory platform: creating, listing, filtering,
    retrieving, updating, and deleting interview experiences / career stories.
    Stories may optionally include an AI-generated summary.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Stories
    description: Interview experiences and career stories

paths:
  /stories:
    post:
      tags: [Stories]
      summary: Create a story
      description: >
        Creates a new story owned by the authenticated user. When
        `generateSummary` is true an AI summary is generated (a summarization
        failure is logged and results in a null summary rather than failing the
        request).
      operationId: createStory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
      responses:
        '201':
          description: Story created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Stories]
      summary: List stories (paginated)
      description: Returns a paginated list of stories, optionally filtered by category. Public endpoint.
      operationId: getAllStories
      parameters:
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - $ref: '#/components/parameters/StoryOrderByQuery'
        - name: category
          in: query
          required: false
          description: >
            Filter by one or more category names (case-insensitive). Repeat the
            parameter to pass multiple values, e.g. `?category=Backend&category=System%20Design`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Stories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedStories'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stories/user/{userId}:
    get:
      tags: [Stories]
      summary: List stories by a specific user (paginated)
      description: Public endpoint.
      operationId: getStoriesByUser
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - $ref: '#/components/parameters/StoryOrderByQuery'
        - name: category
          in: query
          required: false
          description: Filter by one or more category names (case-insensitive).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: User stories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedStories'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stories/{storyId}:
    get:
      tags: [Stories]
      summary: Get a story by ID
      description: Public endpoint.
      operationId: getStoryById
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      responses:
        '200':
          description: Story retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Stories]
      summary: Update a story
      description: >
        Updates a story. Requires authentication; the caller must be the story
        owner or an admin. At least one field is required.
      operationId: updateStory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryRequest'
      responses:
        '200':
          description: Story updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Stories]
      summary: Delete a story
      description: >
        Soft-deletes a story. Requires authentication; the caller must be the
        story owner or an admin.
      operationId: deleteStory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoryIdPath'
      responses:
        '204':
          description: Story deleted successfully (no content)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/login

  parameters:
    StoryIdPath:
      name: storyId
      in: path
      required: true
      description: Story UUID
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    FindQuery:
      name: find
      in: query
      required: false
      description: Free-text search term
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ItemsPerPageQuery:
      name: itemsPerPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortDirectionQuery:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
        default: ASC
    StoryOrderByQuery:
      name: orderBy
      in: query
      required: false
      description: Field to order results by
      schema:
        type: string
        enum: [storyId, userId, title, body, createdAt, updatedAt]
        default: userId

  schemas:
    CreateStoryRequest:
      type: object
      additionalProperties: false
      required: [title, body, generateSummary]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
          example: My Google onsite experience
        body:
          type: string
          minLength: 10
          maxLength: 5000
        categoryIds:
          type: array
          default: []
          items:
            type: string
            format: uuid
        generateSummary:
          type: boolean
          description: Whether to generate an AI summary for the story.
          example: false

    UpdateStoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
        body:
          type: string
          minLength: 10
          maxLength: 5000
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        generateSummary:
          type: boolean

    Story:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        summary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: '#/components/schemas/StoryCategory'
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StoryUser'

    StoryCategory:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true

    StoryUser:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        name:
          type: string
        organization:
          type: string
          nullable: true

    PaginatedStories:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Story'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    PaginationMetadata:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        itemsPerPage:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        nextPage:
          type: integer
          nullable: true
        previousPage:
          type: integer
          nullable: true

    SuccessEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
        result:
          description: Present only when the endpoint returns data.
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    ValidationError:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: The caller lacks permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
