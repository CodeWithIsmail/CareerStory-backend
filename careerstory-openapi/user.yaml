openapi: 3.0.3
info:
  title: CareerStory API - Users
  description: >
    User endpoints for the CareerStory platform: listing users, retrieving
    profiles, updating one's own profile, changing roles (admin), and deleting
    users.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Users
    description: User profile and account management

paths:
  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      description: Returns a paginated list of users. Public endpoint.
      operationId: getAllUsers
      parameters:
        - $ref: '#/components/parameters/FindQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/ItemsPerPageQuery'
        - $ref: '#/components/parameters/SortDirectionQuery'
        - name: orderBy
          in: query
          required: false
          description: Field to order results by
          schema:
            type: string
            enum: [userId, userName, name, email, joinDate]
            default: userName
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/profile:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      description: Updates the current user's own profile. At least one field is required.
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/change-role/{userId}:
    patch:
      tags: [Users]
      summary: Change a user's role (admin only)
      operationId: changeUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by ID
      description: Public endpoint.
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/login

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    FindQuery:
      name: find
      in: query
      required: false
      description: Free-text search term
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ItemsPerPageQuery:
      name: itemsPerPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortDirectionQuery:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
        default: ASC

  schemas:
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
          nullable: true
        organization:
          type: string
          maxLength: 255
          nullable: true
        linkedInUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        githubUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        portfolioUrl:
          type: string
          format: uri
          maxLength: 255
          nullable: true

    UpdateUserRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, USER]

    UserProfile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
        organization:
          type: string
          nullable: true
        linkedInUrl:
          type: string
          format: uri
          nullable: true
        githubUrl:
          type: string
          format: uri
          nullable: true
        portfolioUrl:
          type: string
          format: uri
          nullable: true
        isEmailVerified:
          type: boolean
        role:
          type: string
          enum: [ADMIN, USER]
        joinDate:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    PaginationMetadata:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        itemsPerPage:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        nextPage:
          type: integer
          nullable: true
        previousPage:
          type: integer
          nullable: true

    SuccessEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
        result:
          description: Present only when the endpoint returns data.
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, statusCode, message]
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string

  responses:
    ValidationError:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: The caller lacks permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
